<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Destino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-dark text-white">

    <div class="box d-flex align-items-center justify-content-center py-5">
        <div class="card card-m shadow-lg w-100">

            <div class="head text-center text-white py-4 px-3">
                <div class="ico mx-auto mb-2"><i class="bi bi-moon-stars-fill"></i></div>
                <h3 class="fw-bold mb-1">El Juego del Destino</h3>
                <p class="small text-white-50 m-0">Descubre qué te depara el futuro</p>
            </div>

            <div class="card-body p-4 bg-white text-dark">
                <form action="/post" method="POST">

                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" name="nom" class="form-control" placeholder="Tu nombre" required>
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-calendar-event-fill"></i></span>
                        <input type="number" name="eda" class="form-control" placeholder="Tu edad" required min="1"
                            max="120">
                    </div>

                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-palette-fill"></i></span>
                            <input type="text" name="col" class="form-control" placeholder="Tu color favorito" required>
                        </div>
                        <span class="text-muted sub">Ej. rojo, azul, verde, morado, amarillo...</span>
                    </div>

                    <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-balloon-heart-fill"></i></span>
                            <input type="text" name="ani" class="form-control" placeholder="Tu animal favorito"
                                required>
                        </div>
                        <span class="text-muted sub">Ej. perro, gato, águila, león, delfín...</span>
                    </div>

                    <div class="text-center mb-4">
                        <div class="ball mx-auto"></div>
                    </div>

                    <button type="submit" class="btn btn-m w-100 py-2 fw-bold text-white shadow-sm">
                        <i class="bi bi-magic"></i> Revelar mi destino
                    </button>
                </form>
            </div>

        </div>
    </div>

</body>

</html>
